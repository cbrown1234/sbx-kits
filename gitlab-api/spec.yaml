schemaVersion: "2"
kind: mixin
name: gitlab-api
displayName: GitLab (API — glab + token auth)
description: >
  Installs the glab CLI and wires up token-based auth for gitlab.com so the
  agent can open merge requests over the API. Credential injection is handled
  by the host-side proxy: the sandbox only ever sees the placeholder string
  "proxy-managed" in GITLAB_TOKEN; the real token is injected into the
  PRIVATE-TOKEN header at the network layer. Pair with the gitlab-ssh kit if
  you also need git push/pull over SSH.

permissions:
  network:
    allow:
      - gitlab.com

credentials:
  - service: gitlab
    description: GitLab personal/project access token (api scope)
    apiKey:
      name: GITLAB_TOKEN
      proxyManaged: true
      inject:
        - domain: gitlab.com
          header: PRIVATE-TOKEN
          format: "%s"

setup:
  install:
    - command: |
        set -e
        # setup.install re-runs on every sandbox recreate, so skip the
        # network round-trip if a prior create (or the base image) already
        # put glab on PATH.
        if command -v glab >/dev/null 2>&1; then
          echo "glab already installed: $(glab --version)"
          exit 0
        fi
        VERSION=$(curl -sf 'https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases?per_page=1' \
          | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^v//')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARCH=amd64  ;;
          aarch64) ARCH=arm64  ;;
          armv6l)  ARCH=armv6  ;;
          i386|i686) ARCH=386  ;;
        esac
        curl -sfL "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${VERSION}/glab_${VERSION}_linux_${ARCH}.tar.gz" \
          -o /tmp/glab.tar.gz
        tar xzf /tmp/glab.tar.gz -C /usr/local/bin --strip-components=1 bin/glab
        rm /tmp/glab.tar.gz
      description: Install latest glab binary from the GitLab Package Registry (skipped if already present)
    - command: "glab config set -g host gitlab.com"
      user: "1000"
      description: Point glab at gitlab.com by default
    - command: |
        git config --global credential."https://gitlab.com".helper "!glab auth git-credential"
      user: "1000"
      description: git HTTPS auth

agentInstructions:
  content: |
    `glab` is available, with a proxy managed token, and configure as a git credential helper
