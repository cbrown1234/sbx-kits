schemaVersion: "2"
kind: mixin
name: claude-code-rc-shim
displayName: Claude Code RC Scoped-Token Shim
description: >
  Installs the scoped-token egress shim that lets Claude Code Remote Control
  (RC) work inside an sbx sandbox. The shim is a local mitmproxy-based HTTPS
  proxy: it defaults every request to sbx's injecting forward proxy, but
  bypasses credential injection for RC's scoped-token paths
  (sessions/work-lease/events) when the outgoing Authorization is already a
  real scoped token — preventing the 401/403 worker_register_failed errors
  caused by the unconditional header rewrite. It also strips the
  server-injected "Message sent at …" timestamp that breaks leading
  slash-commands in remote messages.

  The shim's scripts are vendored into this kit under files/home/ (see
  README for the upstream source and how to re-sync), so install no longer
  clones anything and doesn't need github.com in permissions.

  Setup and the daemon both run from a single setup.startup entry rather
  than setup.install: kit-provided files (files/home/) aren't mounted
  into the container until the startup phase, so an install step can't see
  them (it runs before the mount and fails with "not found"). PATH is
  exported to include ~/.local/bin before setup.sh runs, not after: the
  startup hook's shell doesn't inherit the same PATH as an interactive
  session, so setup.sh's `command -v mitmdump` check (run right after `uv
  tool install`) silently failed under `set -e` before the export was
  reordered — the script died with no error output partway through, right
  after the uv install log lines. setup.startup re-runs on every sandbox
  restart, not just the first boot: sandboxes auto-stop after ~30s idle and
  rerun startup hooks fresh on the next connection, which also means the
  shim daemon is killed and must actually come back up each time (this is
  the crux of the routing problem below, not something a kit can prevent).

  setup.sh's own network calls (uv fetching mitmproxy) failed with
  "Connection refused" even when its env-var prefix explicitly pinned
  HTTPS_PROXY to the real gateway -- deterministically, not as a boot-
  timing race. Root cause: BASH_ENV=/etc/sandbox-persistent.sh is a real
  container-level env var, and setup.sh's own `#!/usr/bin/env bash`
  shebang means bash re-sources that file at its own startup for any
  non-interactive invocation, unconditionally -- which re-exports
  HTTPS_PROXY=127.0.0.1:8080 (the shim, not yet listening at that point)
  and silently clobbers the pin, regardless of what was passed in via the
  `VAR=val command` prefix. `env -u BASH_ENV` on the call strips it so
  setup.sh keeps the pinned gateway value. A short retry loop (3 attempts,
  3s apart) remains as defense-in-depth for genuine transient network
  blips, now that it isn't fighting a self-inflicted, deterministic
  failure.

  Routing plain `claude` through the shim (no rc-claude wrapper) went
  through three designs before landing on the current one:

  1. A container-level environment.variables override -- reverted because
     it's merged into every kit's setup.install env, not just the final
     container, and broke gitlab-api's install step (needs real internet
     egress before the shim exists to route through).
  2. A readiness-poll-then-export snippet appended to
     /etc/sandbox-persistent.sh (sourced by login shells, and via BASH_ENV
     for non-interactive bash children), written from setup.install so
     it's present before any session can attach. This closed the original
     "only works the second time a sbx is run" race, but broke down under
     sbx's auto-stop/restart cycle: SCOPED_TOKEN_SHIM_READY is an exported
     env var, scoped to one process, so it never carries over to the *next*
     `claude` launch (a fresh, unrelated process) -- meaning every single
     launch re-ran the full ~30s poll loop, and if that timed out (the
     shim genuinely wasn't back up yet after a restart) the snippet still
     unconditionally exported the shim address, leaving that session
     pointed at a dead proxy with RC silently unreachable.
  3. The current design: patch /usr/local/lib/sandbox/start-agent directly
     (see setup.startup below) instead of going through
     sandbox-persistent.sh/BASH_ENV at all. Confirmed via direct process
     inspection (/proc/<pid>/environ on the live `claude` process, and
     tracing its launcher) that start-agent is the one guaranteed
     synchronous choke point every `claude` launch passes through --
     Docker's own comment in the generated file documents it as a
     supported edit-as-root customization point that "persists across
     restarts." The wait is now short (~6s, not 30s: a routine restart
     only needs an already-installed mitmdump to spawn and bind, not a
     fresh `uv tool install`) and fails open -- if the shim isn't up in
     time, start-agent leaves the sandbox's default gateway proxy alone
     instead of pointing at a dead one, so `claude` still starts and works
     normally; that session just won't have RC until the shim catches up.
     Trade-off: this fully overwrites Docker's generated start-agent
     rather than patching it in place, so if a future base image adds new
     logic there, this kit's copy won't pick it up silently -- the
     embedded case statement is a verbatim copy of the version this kit
     was built against.

  The start-agent patch had to move from setup.install to the first
  (non-backgrounded) setup.startup entry: install runs as a bare `docker
  run` of the raw base image, before whatever generates start-agent has run
  at all -- tried install first and it failed outright with "No such file
  or directory". This reopens a race in principle (startup isn't guaranteed
  to finish before a session attaches, which is exactly why the persistent.sh
  snippet moved to install originally), but the practical window is now a
  single synchronous `tee` of a few hundred bytes -- milliseconds, not the
  10+ seconds a fresh `uv tool install` could take -- so it's kept as a
  separate, non-backgrounded startup entry that runs to completion before
  the second (backgrounded) entry even starts.

  rc-claude.sh (still symlinked as `rc-claude`) remains as a manual
  fallback that gives a clear error if the shim never comes up.

permissions:
  network:
    allow:
      - pypi.org
      - files.pythonhosted.org

setup:
  startup:
    - command:
        - sh
        - -c
        - |
          set -euo pipefail
          # Not backgrounded, deliberately: must finish (a fast, synchronous
          # file write) before this startup entry returns and the next one
          # -- which backgrounds the slow mitmproxy setup -- even starts, so
          # the patched launcher is in place as early in the boot as this
          # kit can manage. See description for why this couldn't move to
          # setup.install instead. Idempotent guard in case startup
          # re-runs on a restart with the patch already in place.
          if ! sudo grep -q claude-code-rc-shim /usr/local/lib/sandbox/start-agent 2>/dev/null; then
            sudo tee /usr/local/lib/sandbox/start-agent > /dev/null <<'AGENT'
          #!/bin/bash
          # Patched by claude-code-rc-shim (see spec.yaml description for why):
          # wait briefly for the local scoped-token shim on 127.0.0.1:8080, then
          # route through it -- RC needs the Authorization header to reach it
          # unmodified, which sbx's own forward proxy won't allow. The shim is
          # killed on every sandbox auto-stop and must actually come back up, so
          # this waits (bounded, ~6s) rather than assuming it's already there.
          # Fails open: if it's not up in time, launch through the sandbox's
          # normal proxy instead of a dead one -- this session just won't have
          # RC until the shim catches up.
          _shim_ready=0
          for _i in 1 2 3 4 5 6; do
            _code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:8080 2>/dev/null || true)"
            if [ "$_code" != "000" ] && [ -n "$_code" ]; then
              _shim_ready=1
              break
            fi
            sleep 1
          done
          if [ "$_shim_ready" = "1" ]; then
            export HTTPS_PROXY="http://127.0.0.1:8080" HTTP_PROXY="http://127.0.0.1:8080"
            export https_proxy="http://127.0.0.1:8080" http_proxy="http://127.0.0.1:8080"
          fi

          # Original body below, verbatim (see start-agent's own comment: the
          # first case keeps the agent's default options, a leading
          # sub-command drops them, matching the CLI's historical launch
          # behavior; user-supplied arguments are forwarded as "$@").
          case "${1-}" in
          -*|"") exec 'claude' '--dangerously-skip-permissions' "$@" ;;
          *) exec 'claude' "$@" ;;
          esac
          AGENT
            sudo chmod +x /usr/local/lib/sandbox/start-agent
          fi
      user: "1000"
      description: Patch the sandbox's agent launcher to wait briefly for the scoped-token shim and route through it, failing open to the normal proxy if it isn't up yet
    - command:
        - sh
        - -c
        - |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          {
            # Pin setup.sh's own network calls to the real gateway explicitly --
            # never trust the ambient HTTPS_PROXY here, see note above. -u BASH_ENV
            # is required: setup.sh's own bash shebang re-sources
            # /etc/sandbox-persistent.sh (BASH_ENV) at its own startup, which would
            # otherwise clobber this pin right back to the shim before it's up.
            attempt=0
            until env -u BASH_ENV \
                  HTTPS_PROXY="http://gateway.docker.internal:3128" \
                  HTTP_PROXY="http://gateway.docker.internal:3128" \
                  https_proxy="http://gateway.docker.internal:3128" \
                  http_proxy="http://gateway.docker.internal:3128" \
                  "$HOME/scoped-token-shim/setup.sh"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "setup.sh failed after $attempt attempts, giving up" >&2
                exit 1
              fi
              echo "setup.sh failed (attempt $attempt), retrying in 3s..." >&2
              sleep 3
            done
            mkdir -p "$HOME/.local/bin"
            ln -sf "$HOME/scoped-token-shim/rc-claude.sh" "$HOME/.local/bin/rc-claude"
            exec "$HOME/scoped-token-shim/run.sh"
          } > "$HOME/scoped-token-shim/run.log" 2>&1
      user: "1000"
      background: true
      description: One-time setup (install mitmproxy, generate + trust its CA system-wide, symlink rc-claude onto PATH), then start the scoped-token shim daemon on 127.0.0.1:8080 on every sandbox boot

agentContext: |
  A /remote-control workaround (to the lack of sbx support) is in "$HOME/scoped-token-shim/
  and should be running
