schemaVersion: "2"
kind: mixin
name: gitlab
displayName: GitLab (glab + token auth)
description: >
  Installs the glab CLI and wires up token-based auth for gitlab.com so the
  agent can push branches (over the SSH agent, forwarded automatically) and
  open merge requests (over the API, via this kit's credential wiring).

# --- Network -----------------------------------------------------------
# v2 permissions block: the egress allowlist. If you're on self-hosted
# GitLab, replace gitlab.com everywhere in this file with your hostname.
permissions:
  network:
    allow:
      - gitlab.com
      - gitlab.com:22

# --- Credentials ---------------------------------------------------------
# v2 credentials are a flat list, one entry per service, combining what
# used to be three separate v1 blocks (credentials.sources, network.
# serviceDomains, network.serviceAuth) into one apiKey sub-block.
#
# Note there's no env/file source declared here - in v2 the kit only
# describes WHAT it needs (service id + where to inject it). WHERE the
# real value lives is entirely up to the user-side bindings file
# (~/.config/sbx/credentials.yaml), populated by `sbx secret set-custom`.
credentials:
  - service: gitlab
    description: GitLab personal/project access token (api scope)
    apiKey:
      name: GITLAB_TOKEN
      proxyManaged: true
      inject:
        - domain: gitlab.com
          header: PRIVATE-TOKEN
          format: "%s"

# --- Install ---------------------------------------------------------
setup:
  install:
    - command: |
        set -e
        # Resolve the latest release version via the GitLab API (stays on gitlab.com).
        VERSION=$(curl -sf 'https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases?per_page=1' \
          | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4 | sed 's/^v//')
        # Map uname -m to glab's release architecture labels.
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARCH=amd64  ;;
          aarch64) ARCH=arm64  ;;
          armv6l)  ARCH=armv6  ;;
          i386|i686) ARCH=386  ;;
        esac
        # Download from the GitLab Package Registry and install.
        # The archive has wrap_in_directory=false, so bin/glab sits one level deep.
        curl -sfL "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${VERSION}/glab_${VERSION}_linux_${ARCH}.tar.gz" \
          -o /tmp/glab.tar.gz
        tar xzf /tmp/glab.tar.gz -C /usr/local/bin --strip-components=1 bin/glab
        rm /tmp/glab.tar.gz
      description: Install latest glab binary from the GitLab Package Registry (all traffic stays on gitlab.com)
    - command: "glab config set -g host gitlab.com"
      user: "1000"
      description: Point glab at gitlab.com by default
