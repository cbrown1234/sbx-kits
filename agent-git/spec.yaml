schemaVersion: "2"
kind: mixin
name: agent-git
displayName: Agent git
description: >
  Setup the agent to operate only via token auth
  with it's own git user config

setup:
  startup:
    - command:
        - sh
        - -c
        - |
          git config --global user.name 'Sandbox Agent' &&
          git config --global user.email 'browniantech@gmail.com'
      user: "1000"
      description: Agent identity
    - command:
        - sh
        - -c
        - |
          git config --global url."https://github.com/".insteadOf "git@github.com:" &&
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/" &&
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:" &&
          git config --global --add url."https://gitlab.com/".insteadOf "ssh://git@gitlab.com/"
      user: "1000"
      description: SSH-to-HTTPS rewriting

agentInstructions:
  content: |
    Git remotes for github.com and gitlab.com are rewritten to HTTPS and
    authenticated by the sandbox proxy. Commits are authored as the bot account.
    `gh` and `glab` work as normal; the real tokens are injected host-side.
