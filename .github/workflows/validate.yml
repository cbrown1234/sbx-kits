name: Validate kits

# Builds every kit with the v3 sandbox-kit BuildKit frontend, which strictly
# decodes and validates the descriptor during the build. A successful build
# is the validation; `--output type=cacheonly` throws the result away.
#
# This replaces the v2 `verify-kit-spec` check from docker/sbx-kits-contrib,
# which only understands `spec.yaml` (schemaVersion 1/2). `sbx kit validate`
# is no use either: it doesn't accept v3 source kits.
#
# Like verify-kit-spec, this fails on warnings as well as errors. The
# frontend reports warnings (e.g. a descriptor over the size budget) without
# failing the build, so the step checks buildx's "N warning(s) found"
# summary.
#
# A kit is any top-level directory holding a descriptor named after itself
# (`<dir>/<dir>.yaml`), the same rule sbx-kits-contrib's discover-kits.sh uses.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Each descriptor's `# syntax=docker/sandbox-kit:3` floats, and the tag is
  # still a pre-release. CI overrides it with BUILDKIT_SYNTAX so a new
  # frontend release can't change what passes here unannounced. The kits
  # keep the floating line, like upstream's, so sbx builds them with the
  # current frontend. Renovate bumps this digest (see .github/renovate.json5).
  SANDBOX_KIT_FRONTEND: docker/sandbox-kit:3@sha256:922fd778877714b2353de978c4993b81fe2e1908793630205eedbd7229ca0a1f

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build every kit
        run: |
          set -euo pipefail
          status=0
          found=0
          log="${RUNNER_TEMP}/build.log"
          for f in */*.yaml; do
            kit=$(dirname "$f")
            [ "$f" = "${kit}/${kit}.yaml" ] || continue
            found=1
            echo "::group::build ${kit}"
            if ! (cd "$kit" && docker buildx build . -f "${kit}.yaml" \
                  --build-arg BUILDKIT_SYNTAX="${SANDBOX_KIT_FRONTEND}" \
                  --output type=cacheonly --progress=plain 2>&1) | tee "$log"; then
              echo "::error file=${f}::${kit} failed to build"
              status=1
            elif grep -Eq '[0-9]+ warnings? found' "$log"; then
              echo "::error file=${f}::${kit} built with warnings"
              status=1
            fi
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "::error::no kits found"; exit 1; }
          exit "$status"
