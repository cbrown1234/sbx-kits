schemaVersion: "2"
kind: mixin
name: gitlab-ssh
displayName: GitLab (SSH)
description: >
  Opens port 22 to gitlab.com so git push/pull over SSH works inside the
  sandbox. sbx automatically forwards SSH_AUTH_SOCK from the host, so no
  key management or credential wiring is needed — this kit is purely a
  network-policy cap.

permissions:
  network:
    allow:
      - gitlab.com:22
